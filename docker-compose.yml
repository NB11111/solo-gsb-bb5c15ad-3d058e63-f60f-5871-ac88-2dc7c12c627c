services:
  bidi-audit:
    build: .
    image: bidi-audit-api:latest
    container_name: bidi-audit-api
    ports:
      - "8000:8000"
    environment:
      BIDI_DB_PATH: /data/audits.db
      BIDI_MAX_DEPTH: "60"
    volumes:
      - bidi-audit-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bidi-audit-data:
